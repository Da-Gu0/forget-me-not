<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勿忘我 · 序章</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{font-family:"Source Han Serif SC","Songti SC","STSong",serif;background:#000;transition:opacity 1.5s ease;}
  body.fading-out{opacity:0;}

  #stage{position:fixed;inset:0;overflow:hidden;background:#000;}

  /* 图片层：<img> 标签 + onerror 兜底（背景色） */
  .scene{
    position:absolute;inset:0;
    opacity:0;transition:opacity 0.8s ease;
    pointer-events:none;
    z-index:1;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    background-color:#F5EDE0;
  }
  .scene.show{opacity:1;}
  .scene img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  /* 暗色蒙版 */
  .scene.dark-veil::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%);
    z-index:2;
  }
  /* 序章结尾：走廊内景慢镜头推进（60秒缩放 100%→103% 循环） */
  .scene.slow-zoom{
    animation:slowZoom 60s ease-in-out infinite;
  }
  @keyframes slowZoom{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.03);}
  }
  /* 笔记本图：中央浮动 */
  .scene.notebook-mode{background-size:300px auto;}
  .scene.notebook-mode::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at center, rgba(245,237,224,0) 0%, rgba(245,237,224,.3) 100%);
    z-index:2;
  }
  /* 外婆剪影：右侧 */
  .scene.grandma-mode{background-position:right center;background-size:auto 80%;}
  .scene.grandma-mode::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.2) 40%, rgba(0,0,0,0) 70%);
    z-index:2;
  }

  /* 封面（嵌入到序章最开头） */
  #cover{
    position:fixed;inset:0;
    background:url('wang_assets/cover_bg.jpg') center/cover no-repeat;
    z-index:100;
    transition:opacity 1.2s ease;
  }
  #cover.hide{opacity:0;pointer-events:none;}
  #cover-title{
    position:absolute;left:50%;top:38%;
    transform:translate(-50%,-50%);
    font-family:"STKaiti","KaiTi","霞鹜文楷",serif;
    color:#fff5e0;text-align:center;
    text-shadow:0 0 24px rgba(196,168,122,.5), 0 4px 30px rgba(0,0,0,.6);
    pointer-events:none;z-index:110;
  }
  #cover-title .main{font-size:96px;letter-spacing:.5em;font-weight:300;}
  #enter-btn{
    position:fixed;left:50%;top:70%;
    transform:translate(-50%,-50%);
    z-index:9999;
    font-family:"STKaiti","KaiTi","霞鹜文楷",serif;
    font-size:24px;color:#fff5e0;letter-spacing:.3em;
    background:rgba(196,168,122,.35);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1.5px solid rgba(255,235,200,.45);
    border-radius:22px;
    padding:18px 64px;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    transition:all .3s ease;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  #enter-btn:hover{
    background:rgba(220,190,140,.5);
    box-shadow:0 12px 40px rgba(196,168,122,.3);
    transform:translate(-50%,-50%) translateY(-2px);
  }
  #enter-btn:active{transform:translate(-50%,-50%) scale(.97);}

  /* 内容块（文字+选项）—— 它们永远在同一个流里，绝不重叠 */
  #content{
    position:absolute;left:50%;bottom:8%;
    transform:translateX(-50%);
    width:min(720px,88%);
    z-index:10;
    display:flex;flex-direction:column;gap:18px;align-items:center;
    transition:bottom .4s ease, transform .4s ease;
  }
  #content.shift-up{
    bottom:50%;
    transform:translate(-50%,50%);
  }
  #text{
    font-size:20px;line-height:2.2;
    color:#F5EDE0;
    text-shadow:0 1px 6px rgba(0,0,0,.7);
    text-align:center;
    padding:0 20px;
    white-space:pre-wrap;
  }

  #progress{
    position:fixed;bottom:20px;left:0;right:0;
    text-align:center;font-size:12px;
    color:rgba(245,237,224,.7);
    letter-spacing:.3em;z-index:20;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
  }
  #hint{
    position:fixed;bottom:50px;left:0;right:0;
    text-align:center;font-size:12px;
    color:rgba(245,237,224,.55);
    letter-spacing:.2em;z-index:20;
    opacity:0;transition:opacity .4s ease;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
  }
  #hint.show{opacity:1;animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  #choices{
    display:flex;flex-direction:column;gap:14px;align-items:center;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease;
  }
  #choices.show{opacity:1;pointer-events:all;}
  .choice{
    background:rgba(245,237,224,.95);color:#4A4038;
    border:1.5px solid #8B7355;border-radius:14px;
    padding:14px 26px;font-family:inherit;
    font-size:17px;min-width:320px;max-width:520px;
    text-align:center;cursor:pointer;
    transition:all .2s ease;white-space:pre-wrap;
  }
  .choice:hover{background:#ead9bf;border-width:2.5px;}
  .choice:active{transform:scale(.97);}

  #chapter{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#F5EDE0;
    font-family:"STKaiti","KaiTi",serif;
    z-index:60;opacity:0;pointer-events:none;
    transition:opacity 1s ease;
    background:rgba(0,0,0,.75);
  }
  #chapter.show{opacity:1;}
  #chapter .main{font-size:56px;letter-spacing:.5em;font-weight:300;margin-bottom:22px;color:#F5EDE0;text-shadow:0 2px 16px rgba(196,168,122,.5);}
  #chapter .sub{font-size:16px;opacity:.6;letter-spacing:.3em;}

  @media (max-width:768px){
    #text{font-size:16px;line-height:2;}
    .choice{font-size:15px;min-width:260px;padding:12px 18px;}
    #chapter .main{font-size:32px;}
    #cover-title .main{font-size:60px;letter-spacing:.4em;}
    #enter-btn{font-size:18px;padding:14px 44px;border-radius:18px;}
  }
</style>
</head>
<body>
<div id="stage">
  <!-- 6张图作为 <img> 标签 + onerror 兜底 -->
  <div class="scene notebook-mode" data-scene="notebook" style="background-image:url('wang_assets/prologue/notebook.jpg');">
    <img src="wang_assets/prologue/notebook.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="scene dark-veil" data-scene="door_outside" style="background-image:url('wang_assets/prologue/door_outside.jpg');">
    <img src="wang_assets/prologue/door_outside.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="scene grandma-mode" data-scene="grandma" style="background-image:url('wang_assets/prologue/grandma.jpg');">
    <img src="wang_assets/prologue/grandma.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="scene dark-veil" data-scene="door_hand" style="background-image:url('wang_assets/prologue/door_hand.jpg');">
    <img src="wang_assets/prologue/door_hand.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="scene dark-veil" data-scene="hallway_far" style="background-image:url('wang_assets/prologue/hallway_far.jpg');">
    <img src="wang_assets/prologue/hallway_far.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="scene dark-veil" data-scene="hallway_near" style="background-image:url('wang_assets/prologue/hallway_near.jpg');">
    <img src="wang_assets/prologue/hallway_near.jpg" alt="" onerror="this.style.display='none'">
  </div>
</div>

<!-- 封面（嵌入到序章最开头） -->
<div id="cover">
  <div id="cover-title">
    <div class="main">勿 忘 我</div>
  </div>
  <button id="enter-btn">推 开 房 门</button>
</div>

<div id="content">
  <div id="text"></div>
  <div id="choices"></div>
</div>
<div id="progress"></div>
<div id="hint">点击继续 ▸</div>
<div id="chapter">
  <div class="main">第一章 · 王爷爷</div>
  <div class="sub">CHAPTER ONE</div>
</div>

<script>
const contentEl = document.getElementById('content');
const textEl = document.getElementById('text');
const progressEl = document.getElementById('progress');
const hintEl = document.getElementById('hint');
const choicesEl = document.getElementById('choices');
const chapterEl = document.getElementById('chapter');

let typewriterTimer = null;
let currentAction = null;
let currentFullText = '';
let currentSceneName = null;

function showScene(name){
  if (currentSceneName === name) return;
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('show'));
  if (name){
    const el = document.querySelector('.scene[data-scene="'+name+'"]');
    if (el) el.classList.add('show');
  }
  currentSceneName = name;
}

function typeText(text, cb){
  if (typewriterTimer){clearTimeout(typewriterTimer);}
  textEl.textContent = '';
  currentFullText = text;
  let i = 0;
  const speed = 55;
  function tick(){
    if (i < text.length){
      textEl.textContent += text[i];
      i++;
      typewriterTimer = setTimeout(tick, speed);
    } else {
      typewriterTimer = null;
      if (cb) cb();
    }
  }
  tick();
}

// advance：打字中点击 → 显示完整文字（不推进）；第二次点击才推进
function advance(){
  // 选项期间不响应
  if (choicesEl.classList.contains('show')) return;
  // 1. 打字中点击 → 显示完整文字，currentAction 保留等下次推进
  if (typewriterTimer){
    clearTimeout(typewriterTimer);
    typewriterTimer = null;
    if (currentFullText) textEl.textContent = currentFullText;
    // 立即推进到下一段（不等待）
    if (currentAction && currentAction.onAdvance){
      const fn = currentAction.onAdvance;
      currentAction = null;
      fn();
    }
    return;
  }
  // 2. 等点击推进
  if (currentAction && currentAction.onAdvance){
    const fn = currentAction.onAdvance;
    currentAction = null;
    fn();
  }
}

function showLines(lines, onAllDone, sceneName, progressLabel){
  if (sceneName) showScene(sceneName);
  if (progressLabel) progressEl.textContent = progressLabel;
  let i = 0;
  function nextLine(){
    if (i >= lines.length){
      if (onAllDone) onAllDone();
      return;
    }
    const line = lines[i];
    currentFullText = line.text;
    currentAction = {
      onAdvance: () => {
        hintEl.classList.remove('show');
        i++;
        if (i < lines.length){
          // 立即推进到下一段（不等待，由用户点击控制）
          nextLine();
        } else {
          if (onAllDone) onAllDone();
        }
      }
    };
    typeText(line.text, () => {
      // 打字完成，显示提示
      hintEl.classList.add('show');
    });
  }
  nextLine();
}

function showChoices(prompt, choices, onPick, sceneName, progressLabel){
  if (sceneName) showScene(sceneName);
  if (progressLabel) progressEl.textContent = progressLabel;
  hintEl.classList.remove('show');
  textEl.textContent = prompt;
  // 整个内容块上移让位（文字+选项作为一个整体）
  contentEl.classList.add('shift-up');
  currentAction = null;
  choicesEl.innerHTML = '';
  choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = ch.label;
    btn.onclick = e => {
      e.stopPropagation();
      choicesEl.classList.remove('show');
      choicesEl.innerHTML = '';
      contentEl.classList.remove('shift-up');
      onPick(ch);
    };
    choicesEl.appendChild(btn);
  });
  choicesEl.classList.add('show');
}

function gotoIndex(){
  chapterEl.classList.add('show');
  // 3.5秒后强制跳转（用 location.replace 避免被拦截）
  setTimeout(() => {
    console.log('序章结束，跳转 wang_index.html');
    window.location.replace('wang_index.html');
  }, 3500);
}

// 启动：先显示封面，点击"推开房门"后进入序章
function startPrologue(){
  // 1. 绑定封面按钮
  const coverEl = document.getElementById('cover');
  const enterBtn = document.getElementById('enter-btn');
  enterBtn.addEventListener('click', e => {
    e.stopPropagation();
    // 封面淡出
    coverEl.classList.add('hide');
    // 1.2s 后启动序章（淡出动画完成）
    setTimeout(() => {
      coverEl.style.display = 'none';
      // 开始序章
      progressEl.textContent = '序章';
      scene1_insomnia();
    }, 1200);
  });
  // 2. 点击封面背景也触发（除按钮区域外）
  coverEl.addEventListener('click', () => {
    if (coverEl.classList.contains('hide')) return;
    enterBtn.click();
  });
}

// 节点1：黑屏独白（失眠+笔记本）→ 笔记本图
function scene1_insomnia(){
  showLines([
    {text:'外婆走后的第三个月，我开始习惯性失眠。',pause:2000},
    {text:'不是辗转反侧的睡不着，是哪怕睡着了，也总会在凌晨三点准时惊醒。',pause:2000},
    {text:'醒过来之后，我再也睡不着了。',pause:2000},
    {text:'就坐在书桌前，开一盏微弱的台灯，盯着她留给我的那本笔记本发呆。',pause:2000},
    {text:'外婆一辈子没读过书，一个字都不认识。',pause:2000},
    {text:'可这本干干净净的空白笔记本，她却一直好好收着，常年压在自己的枕头底下。',pause:2000},
    {text:'我从前从来没问过她，留着一本空白本子，到底想写点什么。',pause:2000},
    {text:'现在她不在了，我想替她，把没来不及留下的东西慢慢补上。',pause:2500}
  ], () => setTimeout(scene2_door, 1500), 'notebook', '序章');
}

// 节点2：场景转换（大门外）→ 大门外景
function scene2_door(){
  showLines([
    {text:'我翻了很多资料，问了不少人，最后找到了这里。',pause:2000},
    {text:'时光驿站——一个专门照顾认知症老人的社区空间。',pause:2000},
    {text:'别人跟我说，这里的很多老人，都和我外婆当年的样子很像。',pause:2000},
    {text:'他们记不住今天是几号、星期几，却清清楚楚记得几十年前的一场大雨、一顿家常饭。',pause:2500},
    {text:'他们有时认不出朝夕相处的家人，却牢牢记得孩子小时候最爱吃的东西。',pause:2000},
    {text:'我想来看看他们。',pause:2000},
    {text:'我不是来做什么志愿、帮忙照顾老人的。',pause:2000},
    {text:'我只是想弄明白，外婆生病的那几年，到底是怎么熬过来的。',pause:2500}
  ], () => setTimeout(scene3_choice, 1500), 'door_outside', '序章 · 2/8');
}

// 节点3：回忆碎片 3选1 → 外婆剪影
function scene3_choice(){
  showChoices(
    '我忽然意识到，我好像从来没有真正认识过她。\n\n我只见过她生病、衰老、糊涂的样子。\n\n我完全不知道，她年轻的时候，是怎样一个人。',
    [
      {label:'我只记得她老了之后的样子。', key:'A'},
      {label:'我记得她做的饭。', key:'B'},
      {label:'我记得她手的触感。', key:'C'}
    ],
    ch => {
      if (ch.key === 'A') setTimeout(scene3A_old, 600);
      else if (ch.key === 'B') setTimeout(scene3B_food, 600);
      else setTimeout(scene3C_hand, 600);
    },
    'grandma',
    '序章 · 3/8'
  );
}

function scene3A_old(){
  showLines([
    {text:'我脑海里全是她晚年的模样。',pause:2000},
    {text:'安安静静坐在窗边，眼神空空的，连我的名字都叫不出来。',pause:2500}
  ], () => setTimeout(scene4_recollection, 1200), 'grandma');
}

function scene3B_food(){
  showLines([
    {text:'我一直记得她做的番茄炒蛋，酸甜刚好，是我从小到大最熟悉的味道。',pause:2500},
    {text:'可我从来没问过，她是跟谁学的这道菜。',pause:2500}
  ], () => setTimeout(scene4_recollection, 1200), 'grandma');
}

function scene3C_hand(){
  showLines([
    {text:'我记得她的手，粗糙、干硬，布满做家务磨出来的厚茧。',pause:2500},
    {text:'后来我长大了，总下意识躲开，不太愿意让她牵我的手。',pause:2500}
  ], () => setTimeout(scene4_recollection, 1200), 'grandma');
}

// 节点4：回忆收束（11行）→ 大门外景
function scene4_recollection(){
  showLines([
    {text:'这些事，都是她走了之后，我才一遍遍回想起来的。',pause:2000},
    {text:'她病重的那段日子，记性越来越差，最后连我这个最亲的外孙都认不出了。',pause:2000},
    {text:'那时候的我，心里说不上多难过，更多的是一种莫名的别扭和陌生。',pause:2200},
    {text:'就像路边被一个陌生人拉住、喊住，我看着眼前这个人，心里空空的，没有半点熟悉的温度。',pause:2500},
    {text:'直到后来我才慢慢懂了。',pause:2000},
    {text:'那份别扭和疏离，根本不是她的问题，是我的遗憾。',pause:2000},
    {text:'我只接受了她疼爱我的样子，却从来没有认真了解过她的人生。',pause:2500},
    {text:'她的过往、她的委屈、她的欢喜，我一件都说不上来。',pause:2000},
    {text:'所以我来了这里。',pause:1500},
    {text:'想听听这些老人的故事，看看她们的人生。',pause:2000},
    {text:'也想借着这些细碎的温暖，一点点补齐外婆，我从未参与过的一生。',pause:3000}
  ], () => setTimeout(scene5_choice, 1500), 'door_outside', '序章 · 4/8');
}

// 节点5：跨门槛 3选1 → 推门手
function scene5_choice(){
  showChoices(
    '我在门口站了大概五分钟。\n\n不知道为什么，一直没推门。\n\n可能是怕——\n\n怕推开之后，发现我和这里的人之间，隔着一条跨不过去的河。',
    [
      {label:'但我还是推开了。', key:'go'},
      {label:'我深吸了一口气。', key:'go'},
      {label:'（沉默地，抬手推开门）', key:'go'}
    ],
    ch => setTimeout(scene6_door, 600),
    'door_hand',
    '序章 · 5/8'
  );
}

// 节点6：门开了（10行）→ 走廊远景
function scene6_door(){
  showLines([
    {text:'门推开了。',pause:1500},
    {text:'里面的光线比外面暗一些。',pause:1500},
    {text:'暖黄色的，像是旧台灯的颜色。',pause:2000},
    {text:'走廊尽头有一扇窗户，阳光从那里照进来。',pause:2000},
    {text:'地上有影子。很长的影子。',pause:2000},
    {text:'走廊里很安静。',pause:1500},
    {text:'但我听到有人在轻声说话。',pause:1500},
    {text:'有人在慢慢走路。',pause:1500},
    {text:'有人在笑。',pause:2000},
    {text:'我走进去了。',pause:2500}
  ], () => setTimeout(scene7_first_meeting, 1500), 'hallway_far', '序章 · 6/8');
}

// 节点7上半场：第一次对视（5行独白）→ 走廊近景
function scene7_first_meeting(){
  showLines([
    {text:'有人转过身来看我。',pause:1500},
    {text:'不是特别热情的那种——就是转过头来，看了我一眼。',pause:2000},
    {text:'像在确认——"哦，有人来了。"',pause:2000},
    {text:'我没想到她会对我说什么。',pause:1500},
    {text:'但她说了。',pause:2000}
  ], () => setTimeout(scene7_dialogue, 800), 'hallway_near', '序章 · 7/8');
}

// 节点7下半场：林姐对话
// （拆出来用 showLines 管理 currentAction，修复 7→8 过渡卡死的 bug：
//   旧版直接 typeText，cb 才会设置 currentAction；用户打字中点击会停打字但拿不到 onAdvance，死锁）
function scene7_dialogue(){
  console.log('[序章] 进入 scene7_dialogue（林姐对话）');
  showLines([
    {text:'"你是……新来的吧？"\n\n"进来吧。不用站在门口。"',pause:3000}
  ], () => {
    console.log('[序章] 林姐对话播完，准备进入 scene8_epilogue');
    setTimeout(scene8_epilogue, 800);
  }, 'hallway_near', '序章 · 7/8');
}

// 节点8：序章结尾（6行）→ 走廊近景
function scene8_epilogue(){
  console.log('[序章] scene8_epilogue 启动：慢镜头+渐暗+章节标题+跳转');
  // 启动镜头缓慢推进（60秒缩放 100%→103%，循环）
  const hallway = document.querySelector('.scene[data-scene="hallway_near"]');
  if (hallway) hallway.classList.add('slow-zoom');
  showLines([
    {text:'我抬手攥紧了口袋里的旧笔记本。',pause:2000},
    {text:'我不知道自己什么时候才有勇气翻开它，写下第一行字。',pause:2000},
    {text:'但我很确定，这本空本子，再也不会一直空着了。',pause:3000},
    {text:'外婆，我来找你了。',pause:2000},
    {text:'我不知道能不能拼凑出完整的你。',pause:2000},
    {text:'但我会一点点，慢慢找。',pause:3500}
  ], () => {
    hintEl.classList.remove('show');
    progressEl.textContent = '序章 · 8/8';
    // 1.5秒渐暗 → 显示章节标题 → 3.5秒后跳转
    document.body.classList.add('fading-out');
    setTimeout(() => {
      // 停止镜头推进
      if (hallway) hallway.classList.remove('slow-zoom');
      // 显示章节标题
      chapterEl.classList.add('show');
      // 3.5秒后跳转
      setTimeout(() => {
        window.location.replace('wang_index.html');
      }, 3500);
    }, 1500);
  }, 'hallway_near');
}

// 万能点击 + 键盘
document.addEventListener('click', e => {
  if (choicesEl.classList.contains('show')) return;
  advance();
});
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') advance();
});

// 启动
window.addEventListener('load', startPrologue);
</script>

<!-- 背景音乐 -->
<audio id="bgm" loop preload="auto">
  <source src="assets/audio/bgm.mp3" type="audio/mpeg">
</audio>
<script>
  // 任意点击/键盘首次触发播放，绕过浏览器自动播放限制；音量 40% 避免太响
  (function(){
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.4;
    function play(){ bgm.play().catch(err => console.log('BGM 播放被拦截：', err.message)); }
    document.addEventListener('click', play, {once:true});
    document.addEventListener('keydown', play, {once:true});
  })();
</script>
</body>
</html>
