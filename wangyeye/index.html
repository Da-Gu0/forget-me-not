<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勿忘我 · 王爷爷篇 · 长廊</title>
<style>
  /* ============ 基础 ============ */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a0f08;font-family:"STKaiti","KaiTi","霞鹜文楷",serif;}
  body{display:flex;justify-content:center;align-items:center;}

  /* ============ 16:9舞台容器 ============ */
  #stage{
    position:relative;width:100vw;height:100vh;max-width:177.778vh;max-height:56.25vw;
    overflow:hidden;
    background:url('wang_assets/cover_bg.jpg') center/cover no-repeat;
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }

  /* ============ 全局光束层 ============ */
  .light-beam{
    position:absolute;left:25%;top:0;width:35%;height:100%;
    background:linear-gradient(115deg, rgba(255,235,180,.18) 0%, rgba(255,235,180,.05) 30%, transparent 70%);
    transform:skewX(-8deg);
    pointer-events:none;
    animation:sunDrift 30s ease-in-out infinite;
  }
  @keyframes sunDrift{
    0%,100%{transform:skewX(-8deg) translateX(0);opacity:.85;}
    50%{transform:skewX(-8deg) translateX(20px);opacity:1;}
  }

  /* ============ 暖色光斑层 ============ */
  .sun-spot{
    position:absolute;left:30%;top:35%;width:35%;height:30%;
    background:radial-gradient(ellipse, rgba(255,220,150,.18) 0%, transparent 60%);
    pointer-events:none;
    animation:sunMove 30s ease-in-out infinite;
  }
  @keyframes sunMove{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(40px);}
  }

  /* ============ 整体呼吸光晕 ============ */
  #stage::after{
    content:"";position:absolute;inset:0;
    background:rgba(255,235,200,.04);
    pointer-events:none;
    animation:breath 8s ease-in-out infinite;
  }
  @keyframes breath{0%,100%{opacity:.5;}50%{opacity:1;}}

  /* ============ 极慢推镜头 ============ */
  #scene-wrap{
    position:absolute;inset:0;
    transition:transform 60s ease-in-out infinite;
    animation:zoomIn 60s ease-in-out infinite;
  }
  @keyframes zoomIn{
    0%,100%{transform:scale(1) translateX(0);}
    50%{transform:scale(1.04) translateX(-8px);}
  }

  /* ============ 画布(粒子) ============ */
  #dust{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:5;
  }

  /* ============ 人物热区 ============ */
  .hotspot{
    position:absolute;border-radius:50%;
    cursor:pointer;
    transform:translate(-50%,-50%);
    pointer-events:auto;
    z-index:10;
  }
  .hotspot::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, rgba(255,210,140,.0) 0%, rgba(255,210,140,.0) 100%);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .hotspot:hover::before{
    background:radial-gradient(circle, rgba(255,210,140,.3) 0%, transparent 70%);
    box-shadow:0 0 24px 4px rgba(255,210,140,.4);
  }

  /* 人物标签 */
  .name-tag{
    position:absolute;left:50%;bottom:calc(100% + 8px);
    transform:translateX(-50%) translateY(6px);
    font-family:"STKaiti","KaiTi",serif;font-size:16px;
    color:#5C4632;background:rgba(255,245,225,.92);
    padding:4px 14px;border-radius:14px;
    letter-spacing:.1em;white-space:nowrap;
    box-shadow:0 4px 12px rgba(80,60,40,.25);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .hotspot:hover .name-tag{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ 对话气泡 ============ */
  #dialog{
    position:absolute;left:50%;bottom:6%;
    transform:translateX(-50%) translateY(40px);
    max-width:min(560px,70%);
    background:rgba(245,237,224,.95);
    backdrop-filter:blur(8px);
    border:1.5px solid #8B7355;
    border-radius:20px;
    padding:20px 24px;
    box-shadow:0 12px 40px rgba(0,0,0,.4);
    z-index:30;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .35s cubic-bezier(.4,0,.2,1);
  }
  #dialog.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  #dialog .who{
    font-size:14px;color:#8B7355;font-weight:600;letter-spacing:.1em;margin-bottom:6px;
  }
  #dialog .what{
    font-size:17px;line-height:1.7;color:#4A4038;
  }
  #dialog .close{
    position:absolute;top:8px;right:12px;
    width:28px;height:28px;border:none;background:transparent;
    font-size:18px;color:#9A8B82;cursor:pointer;border-radius:50%;
  }
  #dialog .close:hover{background:rgba(139,115,85,.15);color:#5C4632;}

  /* ============ 闪光效果（点击人物） ============ */
  .flash{
    position:absolute;inset:0;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, transparent 60%);
    pointer-events:none;opacity:0;
  }
  .flash.show{animation:flashAnim .6s ease-out;}
  @keyframes flashAnim{
    0%{opacity:0;transform:scale(.5);}
    50%{opacity:.8;transform:scale(1.1);}
    100%{opacity:0;transform:scale(1.5);}
  }

  /* ============ 标题/入口按钮 ============ */
  #title{
    position:absolute;left:50%;top:5%;
    transform:translateX(-50%);
    font-family:"STKaiti","KaiTi",serif;
    color:#fff5e0;
    text-align:center;
    text-shadow:0 2px 0 rgba(80,50,30,.4), 0 8px 24px rgba(0,0,0,.5);
    pointer-events:none;z-index:20;
  }
  #title .main{
    font-size:42px;letter-spacing:.4em;margin-left:.4em;
  }
  #title .sub{
    font-size:14px;letter-spacing:.35em;color:#E8D8B8;
    margin-top:8px;opacity:.85;
  }

  #enter-btn{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:9999;
    font-family:"STKaiti","KaiTi",serif;
    font-size:22px;color:#fff5e0;letter-spacing:.25em;
    background:rgba(139,115,85,.7);
    backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,235,200,.5);
    border-radius:18px;
    padding:16px 56px;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    transition:all .3s ease;
    text-shadow:0 1px 2px rgba(0,0,0,.3);
    pointer-events:auto !important;
  }
  #enter-btn:hover{
    background:rgba(165,135,100,.85);
    transform:translate(-50%,-50%) translateY(-2px);
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  #enter-btn:active{transform:translate(-50%,-50%) scale(.97);}

  /* 拍照白框 */
  #snap-frame{
    position:absolute;inset:0;
    border:3px solid #fff;
    box-shadow:inset 0 0 30px rgba(255,255,255,.5);
    pointer-events:none;opacity:0;
  }
  #snap-frame.show{animation:snapAnim .4s ease-out;}
  @keyframes snapAnim{
    0%{opacity:1;}
    100%{opacity:0;}
  }

  /* 提示 */
  #hint{
    position:absolute;left:50%;bottom:3%;
    transform:translateX(-50%);
    font-family:"STKaiti","KaiTi",serif;
    font-size:13px;color:rgba(255,235,200,.7);
    letter-spacing:.15em;
    pointer-events:none;z-index:15;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="scene-wrap">
      <div class="light-beam"></div>
      <div class="sun-spot"></div>
    </div>

    <!-- 尘埃粒子画布 -->
    <canvas id="dust"></canvas>

    <!-- 人物热区 -->
    <div class="hotspot" style="left:50%;top:65%;width:8%;height:14%;" data-name="你（主角）" data-msg="……我推开走廊的门。阳光落在木地板上，灰尘在光束里慢慢浮着。">
      <span class="name-tag">你（主角）</span>
    </div>
    <div class="hotspot" style="left:53%;top:35%;width:6%;height:10%;" data-name="林姐" data-msg="来了？今天天气不错，他们都在里面。">
      <span class="name-tag">林姐</span>
    </div>
    <div class="hotspot" style="left:22%;top:52%;width:8%;height:14%;" data-name="下棋奶奶" data-msg="这花是我孙女给我的……她说叫「勿忘我」。">
      <span class="name-tag">下棋奶奶</span>
    </div>
    <div class="hotspot" style="left:32%;top:50%;width:8%;height:14%;" data-name="对弈爷爷" data-msg="老姐姐，您这一步走得妙啊。">
      <span class="name-tag">对弈爷爷</span>
    </div>
    <div class="hotspot" style="left:75%;top:40%;width:7%;height:12%;" data-name="窗边奶奶" data-msg="……我孙子啊，在外地上学。放假会回来的。">
      <span class="name-tag">窗边奶奶</span>
    </div>
    <div class="hotspot" style="left:78%;top:68%;width:9%;height:16%;" data-name="轮椅爷爷" data-msg="老周头啊，我来一针……你别说，坐着坐着就忘了时间。">
      <span class="name-tag">轮椅爷爷</span>
    </div>

    <!-- 闪光层 -->
    <div class="flash" id="flash"></div>
    <!-- 拍照白框 -->
    <div id="snap-frame"></div>

    <!-- 标题 -->
    <div id="title">
      <div class="main">勿 忘 我</div>
      <div class="sub">王 爷 爷 · 铁 盒</div>
    </div>

    <!-- 入口按钮 -->
    <button id="enter-btn" onclick="enterGame()">推 开 房 门</button>

    <!-- 对话气泡 -->
    <div id="dialog">
      <button class="close" onclick="closeDialog()">✕</button>
      <div class="who" id="dialog-who">林姐</div>
      <div class="what" id="dialog-what">来了？</div>
    </div>

    <!-- 提示 -->
    <div id="hint">— 悬停人物可看到名字 · 点击背景听到快门 —</div>
  </div>

  <script>
  /* ============ 粒子系统(尘埃) ============ */
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const PARTICLE_COUNT = 40;

  function resizeCanvas(){
    canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1);
    canvas.height = canvas.offsetHeight * (window.devicePixelRatio || 1);
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function initParticles(){
    particles = [];
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    for (let i = 0; i < PARTICLE_COUNT; i++){
      // 集中在左侧光束附近
      particles.push({
        x: W * (0.2 + Math.random() * 0.35),
        y: Math.random() * H,
        r: 0.5 + Math.random() * 1.5,
        vx: 0.2 + Math.random() * 0.4,
        vy: -0.1 + Math.random() * 0.3,
        opacity: 0.15 + Math.random() * 0.35,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  initParticles();
  window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });

  function drawParticles(t){
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    ctx.clearRect(0, 0, W, H);
    for (const p of particles){
      // 微微左右飘动
      const sway = Math.sin(t * 0.0008 + p.phase) * 0.3;
      p.x += p.vx * 0.016 + sway * 0.05;
      p.y += p.vy * 0.016;
      // 越界循环
      if (p.x > W * 0.6) p.x = W * 0.2;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      // 绘制（暖白）
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 235, 190, ${p.opacity})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      // 光晕
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 220, 160, ${p.opacity * 0.2})`;
      ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function animate(t){
    drawParticles(t);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  /* ============ 人物点击交互 ============ */
  const dialog = document.getElementById('dialog');
  const dialogWho = document.getElementById('dialog-who');
  const dialogWhat = document.getElementById('dialog-what');
  const flash = document.getElementById('flash');
  const snapFrame = document.getElementById('snap-frame');
  const hotspots = document.querySelectorAll('.hotspot');

  hotspots.forEach(h => {
    h.addEventListener('click', e => {
      e.stopPropagation();
      const name = h.dataset.name;
      const msg = h.dataset.msg;
      // 闪光
      flash.classList.remove('show');
      void flash.offsetWidth;
      flash.classList.add('show');
      // 弹出对话
      dialogWho.textContent = name;
      dialogWhat.textContent = msg;
      dialog.classList.add('show');
    });
  });

  function closeDialog(){
    dialog.classList.remove('show');
  }

  /* ============ 点击背景 = 拍照音效 + 白框 ============ */
  document.getElementById('scene-wrap').addEventListener('click', () => {
    snapFrame.classList.remove('show');
    void snapFrame.offsetWidth;
    snapFrame.classList.add('show');
    // 用 WebAudio 合成快门声（避免外部音频）
    playShutter();
  });

  function playShutter(){
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.setValueAtTime(1200, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, ac.currentTime + 0.08);
      g.gain.setValueAtTime(0.15, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
      o.start(ac.currentTime);
      o.stop(ac.currentTime + 0.1);
    } catch(e) {}
  }

  /* ============ 入口按钮 ============ */
  function enterGame(){
    // 渐隐
    const stage = document.getElementById('stage');
    if (stage){
      stage.style.transition = 'opacity 0.8s ease';
      stage.style.opacity = '0';
    }
    setTimeout(() => {
      // 跳转到主游戏
      window.location.href = 'prologue.html';
    }, 800);
  }

  // 按钮多重事件绑定（确保一定能点击）
  window.addEventListener('load', () => {
    const btn = document.getElementById('enter-btn');
    if (!btn){ console.error('找不到enter-btn'); return; }
    console.log('enter-btn found, binding events...');

    // 阻止按钮区域触发 scene-wrap 的拍照白框
    btn.addEventListener('click', e => {
      e.stopPropagation();
      e.preventDefault();
      enterGame();
    });
    btn.addEventListener('mousedown', e => e.stopPropagation());
    btn.addEventListener('touchstart', e => {
      e.stopPropagation();
      e.preventDefault();
      enterGame();
    }, {passive:false});

    // 键盘 Enter 也能进
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') enterGame();
    });
  });
  </script>

  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="auto">
    <source src="assets/audio/bgm.mp3" type="audio/mpeg">
  </audio>
  <script>
    // 任意点击/键盘首次触发播放，绕过浏览器自动播放限制；音量 40% 避免太响
    (function(){
      const bgm = document.getElementById('bgm');
      if (!bgm) return;
      bgm.volume = 0.4;
      function play(){ bgm.play().catch(err => console.log('BGM 播放被拦截：', err.message)); }
      document.addEventListener('click', play, {once:true});
      document.addEventListener('keydown', play, {once:true});
    })();
  </script>
</body>
</html>
